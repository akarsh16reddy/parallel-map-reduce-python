[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "parallel-map-reduce"
version = "0.1.0"
description = "Practical Python multiprocessing and parallel map-reduce examples"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Akarsh" }]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Operating System :: OS Independent",
]

[project.optional-dependencies]
dev = ["ruff>=0.5"]
examples = ["tqdm>=4.66"]

[project.scripts]
parallel-map-reduce = "parallel_map_reduce.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 88
target-version = "py310"
